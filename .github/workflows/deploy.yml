name: Build & Push

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev

      - name: Build & Push API
        run: |
          IMAGE=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT }}/${{ vars.REPO }}/api:latest
          docker build -f api/Dockerfile -t $IMAGE .
          docker push $IMAGE

      - name: Build & Push ETL
        run: |
          IMAGE=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT }}/${{ vars.REPO }}/etl:latest
          docker build -f etl/Dockerfile -t $IMAGE .
          docker push $IMAGE

      - name: Deploy API
        run: |
          gcloud run deploy api \
            --image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT }}/${{ vars.REPO }}/api:latest \
            --region=${{ vars.REGION }} \
            --quiet

      - name: Update ETL Job
        run: |
          gcloud run jobs update etl-job \
            --image=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT }}/${{ vars.REPO }}/etl:latest \
            --region=${{ vars.REGION }} \
            --quiet
