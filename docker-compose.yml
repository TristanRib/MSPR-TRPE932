services:
  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    image: ${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/etl:latest
    volumes:
      - gcs:/app/gcs
    environment:
      - RAW_DIR=/app/gcs/raw
      - PROCESSED_DIR=/app/gcs/processed
      - MODELS_DIR=/app/gcs/models

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/api:latest
    ports:
      - "8080:8080"
    volumes:
      - gcs:/app/gcs
    environment:
      - MODELS_DIR=/app/gcs/models

volumes:
  gcs:
